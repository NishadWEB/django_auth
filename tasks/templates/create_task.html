<!DOCTYPE html>
<html>
<head>
    <title>Create Task</title>
</head>
<body>

<h2>Create Task</h2>

<form method="POST">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title">

    <br><br>

    <label>Description:</label>
    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">Create Task</button>
</form>

<br>

<a href="{% url 'task_list' %}">Back to Tasks</a>

</body>
</html>
