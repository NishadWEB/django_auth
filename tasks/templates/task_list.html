<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
</head>
<body>

<h2>My Tasks</h2>

<p>Welcome, {{ user.username }}</p>

<a href="{% url 'create_task' %}">Create Task</a>

<br><br>

{% for task in tasks %}

    <h3>{{ task.title }}</h3>
    <p>{{ task.description }}</p>

{% empty %}

    <p>You don't have any tasks.</p>

{% endfor %}

<br>

<a href="{% url 'logout' %}">Logout</a>

</body>
</html>
